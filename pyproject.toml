[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-parliament-warehouse"
version = "0.1.0"
description = "Dutch parliament votes and decisions: Tweede Kamer change feed, BigQuery, dbt"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.9"]
bigquery = ["google-cloud-bigquery>=3.25", "dbt-bigquery>=1.9"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
