name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest -q

  # The dbt project on DuckDB, from one real voting day committed as fixtures
  # (scripts/make_sample.py), so pull requests need no cloud credentials.
  dbt:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: /tmp/sample.duckdb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dbt]"

      - name: Load the one-day sample
        run: python -m ingest.cli load-sample

      - name: dbt build (models, contracts, data tests, unit tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Build the report from the sample marts
        run: python -m report.build --out /tmp/site

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
